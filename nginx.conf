events {}
http {
  upstream api { server api:8000; }
  upstream web { server web:3000; }
  server {
    listen 80;
    location /api/ { proxy_pass http://api; proxy_set_header Host $host; }
    location /auth/ { proxy_pass http://api; proxy_set_header Host $host; }
    location /ws/ { proxy_pass http://api; proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
    location / { proxy_pass http://web; proxy_set_header Host $host; }
  }
}
